; ==== engine.ini - all settings (real values, no presets) ====
; Demo maps: keys 1 / 2 / 3 (numpad or top row), G = global lighting on/off.
; Each map has its factory settings (maps.h: map_config). To change one, use the [map1] [map2] [map3] sections
; at the bottom of this file: they override the factory settings, and only for their map.

; --- display ---
width = 1280
height = 720
fullscreen = 0           ; the lamp menu (right-click) only appears in windowed mode
vsync = 0
msaa = 0                 ; 0 = off ; 2/4/8 if the GPU supports it (ignored if fxaa = 1)
fxaa = 0                 ; 1 = FXAA (ps_2_0 ; first time, compiled via d3dx9_xx.dll then the bytecode is cached)
anisotropy = 1           ; 1 = off
auto_low_end = 1        ; 1 = if the detected VRAM is low (< low_end_vram_mb), force anisotropy = 1
low_end_vram_mb = 256  ; VRAM threshold (MB) below which the GPU is considered old
gamma_correct = 0        ; 1 = lighting in linear space ; 0 = faster / compatible with very old GPUs
fov = 50

; --- bake: quality / cost (computed ONCE, then cached in %TEMP%\d3d9engine_cache) ---
texels_per_unit = 24     ; lightmap resolution: texels per world unit
lightmap_max_size = 2048 ; max atlas size (power of 2)
shadow_samples = 64      ; shadow rays per texel (early exit outside the penumbra: cheap)
ao_samples = 32          ; paths launched per node of the indirect lighting grid
indirect_step = 3        ; indirect lighting is computed 1 texel out of N (then interpolated): 2 = 2x more expensive, 4 = 2x cheaper
bounce_count = 3         ; number of light bounces (1 = single bounce, 2-4 = global illumination)
occluder_lod = 1         ; LoD level used for the bake rays (0 = full mesh, 1-2 = fewer triangles to traverse)
bounce_strength = 1.5    ; bounce gain (1.0 = physical ; higher = more visible reflected colors)
bounce_distance = 10     ; bounce range (units)
ao_distance = 4          ; ambient occlusion range
ao_strength = 0.9
blur_passes = 1          ; 3x3 noise smoothing (0 = none)
bake_threads = 0         ; 0 = automatic (number of cores/threads)
exposure = 1.4           ; tone mapping curve (can be changed without re-baking)
; For a very old CPU (e.g. Atom N270): ao_samples = 24, indirect_step = 3, bounce_count = 2, shadow_samples = 32

; --- reflections (overlay 2) ---
reflection_size = 64     ; texels per cubemap face
reflection_upscale = 2   ; bilinear upscale (2 = final texture 128 per face ; 1 = off)
reflection_samples = 4   ; rays per texel for rough surfaces (reflection blur)
refl_filter = 1          ; 1 = reflections only show "in_refl" objects (cubes, spheres, blocks, lamp: the floor is excluded) ; 0 = everything is reflected
bake_gpu_reflections = 1 ; 1 = reflections by GPU rasterization (ps_2_0, ~8x faster) ; 0 = CPU tracer. Requires bake_gpu = 1
; Reflections are NOT recomputed every frame. The queue is emptied in slices:
; we wait reflection_update_interval frames, then rebuild as many objects as
; the reflection_budget_ms budget allows. 15-20 frames/s is enough for reflections.
; Set the budget to 1000 (or more) to recompute everything at once in a single frame.
reflection_update_interval = 30
reflection_budget_ms = 1500.0
; Mip level bias on the reflection cubemaps. 0 = sharp, 1 or 2 = blurrier reflections
; flous mais ~4x moins de memoire lue par pixel. Sur une iGPU qui lit dans la DDR2
; this is the lever that matters (the cost per frame, not the cost of computing).
reflection_lod_bias = 0.0
cube_reflect = 0.25      ; reflection strength of the colored cubes (0..1)
cube_roughness = 0.30    ; roughness of the green/blue cubes (0 = mirror)
platform_reflect = 0.10
metal_reflect = 0.92     ; metallic cube
metal_roughness = 0.06   ; low roughness = sharp reflections
; Reflection cubemaps have a mip chain (up to 8 texels per side): the GPU
; picks the level based on screen footprint. Distant reflections are blurry and cheaper
; without visible seams ; memory cost +33% (≈130 KB for the whole scene).

; --- ray-traced shadows (bake) ---
; Shadows are computed ONCE at bake time and stored in the lightmaps: once baked, no cost per frame
; (same FPS as rt_shadows = 0). Only the bake time and the cache change.
rt_shadows = 1           ; 0 = off (GPU shadow maps only, as before)
                         ; 1 = hybrid: the GPU classifies the texels, the CPU re-traces real rays (BVH) only in the penumbra
                         ;     and near shadow edges -> exact outlines, no acne or peter-panning, moderate extra bake cost
                         ; 2 = everything by CPU ray tracing (reference: slower, no GPU for shadows)
rt_shadow_samples = 64   ; rays per texel on the extended lamp (more = smoother penumbra, longer bake)
rt_shadow_margin = 2     ; mode 1: radius (in texels) of the re-traced zone around shadow edges (0-8)

; --- GPU bake (Shader Model 2.0: any D3D9 SM2 GPU works ; otherwise automatic fallback to the CPU) ---
bake_gpu = 1             ; 1 = soft shadows + reflections computed by the GPU. 0 = everything on the CPU (same as the old version)
gpu_shadow_res = 256     ; shadow cubemap resolution (power of 2, 64..1024). Higher = more precise shadows, a bit slower
gpu_taps = 4             ; lamp points processed per pass (1-4). The engine reduces to 2 then 1 by itself if the shader exceeds 64
                         ; ps_2_0 instructions on your GPU: the result is identical, only the speed changes
gpu_shadow_bias = 1.0    ; anti-acne offset of GPU shadows (0.5 = shadows closer to objects, 2 = less acne)
; The GPU does NOT do indirect lighting (AO + bounces): an SM2 GPU cannot traverse a ray tree.
; This pass stays multi-core on the CPU (bake_threads). Shader compilation goes through d3dx9_xx.dll
; (like FXAA) then is cached ; if this DLL is missing, the bake falls back to the CPU.
; Environment variable ENGINE_BENCH=label: measures the bake, writes bench.log and quits (no game window).

; --- cache & loading ---
cache_enabled = 1
cache_max_files = 8      ; old bakes kept (one lamp position = one file)
loading_hz = 5           ; loading screen refreshes per second

; --- LoD & culling ---
lod_levels = 3           ; number of LoD levels (0 = disabled)
lod_start = 30           ; distance of the 1st level (camera units)
lod_step = 25            ; distance between levels
lod_reduction = 0.5      ; fraction of polygons removed at each level (0.5 = about half)
frustum_culling = 1
depth_prepass = 0        ; depth-only pass before the color pass (EQUAL).
                         ; Measured: +6% per frame here (the scene has no overdraw,
                         ; front-to-back sorting already rejects hidden pixels). Leave it
                         ; at 0 unless the scene gains a lot of geometry that gets hidden.
sphere_segments = 12     ; fineness of the test sphere (polygons: 6*N*N*2)

; --- overlay render distances (units from the camera) ---
overlay_distance = 90    ; beyond this: the lightmap is no longer sampled, the vertex
                         ; color already carries the object's average light (1 texture
                         ; fewer per pixel ; measured gain ~9% on rendering)
reflection_distance = 70 ; beyond this: no more reflections
far_brightness = 0.55

; --- test scene ---
; --- object field (random shapes, sizes, colors and pattern) ---
object_count = 120     ; number of objects in the field (0-200). 120 = 10x the original scene
scene_pattern = 0      ; 0 grid | 1 ring | 2 spiral | 3 pyramid | 4 cluster | 5 random
scene_chunks = 6       ; grouped batches (1 draw call each): limits the number of draw calls
textured_count = 14    ; how many objects carry the procedural texture (grid/lines)
block_cols = 7           ; field of small blocks (max 7x7 = 49)
block_rows = 7
block_seed = 1234
allow_underside = 0      ; 0 = underside never visible: not baked, camera limited to above

; --- lamp (color/intensity changeable live with right-click ; position: arrows, PgUp/PgDn) ---
light_x = -2.0
light_y = 7.0
light_z = 0.5
light_r = 1.0
light_g = 0.95
light_b = 0.85
light_intensity = 120
light_radius = 0.5       ; light size: larger = softer shadows (changing it = re-bake)
; --- multiple lights --- (keys 1-6: selects the light edited by the sliders)
light_count = 6          ; number of lights (1-8). The 1st is the one moved by the arrows, the
                         ; others are fixed and colored (blue, red, green, purple, amber)
light_shadows = 6        ;                         ; diffuse fills: no ray traced, so cost ~ zero
                         ;
                         ; BAKE COST (measured, 120 objects, 4-core PC):
                         ;   6 shadows            36.9 s   <- everything casts shadows
                         ;   3 shadows            19.6 s   <- compromise (2 sharp shadow directions)
                         ;   2 shadows            13.8 s
                         ;   1 shadow               9.5 s   <- 6 colors, one direction
                         ; note: shadow_samples (64) barely changes anything (20.0 s with 16
                         ; samples): the cost is in the number of lights, not in
                         ; the number of rays per texel. The real lever is texels_per_unit:
                         ;   texels_per_unit 24   19.6 s  <- default
                         ;   texels_per_unit 12    6.4 s  <- 3x faster, lightmaps more
                         ;   texels_per_unit 8     3.5 s     pixelated (visible up close)
                         ; diffuse fills: no ray traced, so cost ~ zero
fill_intensity = 0.10    ; fill intensity, RELATIVE to light_intensity.
                         ; The total energy equals light_intensity x (1 + (n-1) x this value):
                         ; beyond ~1.5x, the lightmap saturates and all gradients
                         ; (shadows included) clip. 6 lights at 0.10 = 1.5x.
    ; fill intensity (relative to light_intensity)
lamp_speed = 5.0         ; movement speed (units/s)
lamp_rebake_delay = 1.5  ; seconds of inactivity before re-baking after the lamp moves

ambient_r = 0.10
ambient_g = 0.11
ambient_b = 0.14
background_r = 0.02
background_g = 0.025
background_b = 0.035

; ======================================================================================
; Glass + caustics (map 1): photons launched during the bake through the glass sphere, cached like the rest
; ======================================================================================
caustics = 1             ; 0 = no caustics
caustic_photons = 1200000 ; more = smoother light spot (longer bake)
caustic_blur = 2         ; 3x3 blur passes on the photon noise
glass_ior = 1.5          ; refractive index of the glass (changing it = re-bake)
glass_spec = 1.0         ; glass reflection gain (real time, no re-bake)
glass_flip_x = 0         ; 1 = mirror the glass reflection X axis (test for the reversed-reflection bug)

; ======================================================================================
; Per-map settings (examples in comments: remove the ';' to enable)
; ======================================================================================
[map1]
; light_intensity = 50   ; ceiling light brightness (also adjustable by right-clicking the lamp)
; caustic_photons = 3000000
; bounce_count = 5

